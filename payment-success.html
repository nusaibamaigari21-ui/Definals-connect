<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — Definals Connect</title><link rel="stylesheet" href="/styles.css"></head><body><main class="legal center"><span class="eyebrow">PAYMENT</span><h1>Checking your payment…</h1><p id="msg" class="muted">Please wait while we confirm your transaction.</p><a class="btn" href="/dashboard.html">Go to dashboard</a></main><script>async function run(){const ref=new URLSearchParams(location.search).get('reference');if(!ref){msg.textContent='No payment reference was received.';return}try{const r=await fetch('/api/payments/verify/'+encodeURIComponent(ref));const d=await r.json();msg.textContent=d.success?'Payment confirmed. Your business is now active.':'Payment is not yet confirmed. You can check your dashboard again shortly.'}catch(e){msg.textContent='We could not confirm the payment in this browser. If you completed payment, check your dashboard; the payment webhook may still be processing.'}}run()</script></body></html>
