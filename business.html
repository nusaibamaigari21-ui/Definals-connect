<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business — Definals Connect</title><link rel="stylesheet" href="/styles.css"></head><body><nav><a class="brand" href="/">DEFINALS CONNECT</a><a class="btn small" href="/">Find more businesses</a></nav><main class="section"><div id="root">Loading...</div></main><script>async function load(){const id=new URLSearchParams(location.search).get('id');const r=await fetch('/api/businesses/'+id);const d=await r.json();if(!r.ok){document.getElementById('root').innerHTML='<h2>Business not found</h2>';return}const b=d.business;document.getElementById('root').innerHTML=`<span class="eyebrow">${b.category}</span><h1>${b.name} ${b.verified?'✓':''}</h1><p class="lead">${b.description||''}</p><div class="grid"><div class="card"><b>Location</b><p>${b.location}</p></div><div class="card"><b>Contact</b><p>${b.phone||b.owner_phone||'Not provided'}</p>${b.whatsapp?`<a class="btn" href="https://wa.me/${b.whatsapp.replace(/\D/g,'')}">WhatsApp</a>`:''}</div><div class="card"><b>Online</b><p>${b.website?`<a href="${b.website}" target="_blank">Visit website/social</a>`:'Not provided'}</p></div></div><h2 style="margin-top:45px">Products & services</h2><div class="grid">${d.products.map(p=>`<div class="card"><h3>${p.name}</h3><b>${p.price?'₦'+p.price:'Contact for price'}</b></div>`).join('')||'<p class="muted">No products/services listed yet.</p>'}</div>`}load()</script></body></html>
