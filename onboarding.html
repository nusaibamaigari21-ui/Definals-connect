<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Onboarding — Definals Connect</title><link rel="stylesheet" href="/styles.css"></head><body><nav><a class="brand" href="/">DEFINALS CONNECT</a><a class="btn small" href="/dashboard.html">My dashboard</a></nav><main class="dash"><span class="eyebrow">VENDOR ONBOARDING</span><h1>Build your business profile</h1><p class="lead">Complete your profile, then activate it with the ₦1,000 registration payment.</p><div id="status"></div><form id="businessForm" class="card formgrid"><input name="name" placeholder="Business name" required><select name="category" required><option value="">Choose category</option><option>Food & Drinks</option><option>Fashion</option><option>Beauty & Wellness</option><option>Electronics</option><option>Events</option><option>Professional Services</option><option>Home & Construction</option><option>Education</option><option>Other</option></select><input name="location" placeholder="City / area" required><input name="whatsapp" placeholder="WhatsApp number"><input name="phone" placeholder="Business phone"><input name="website" placeholder="Website / social link"><input class="full" name="logoUrl" placeholder="Logo image URL (optional)"><textarea class="full" name="description" placeholder="Describe what you sell and who you serve"></textarea><button class="btn full">Save business profile</button></form><div class="card" style="margin-top:20px"><span class="eyebrow">ACTIVATION</span><h2>₦1,000</h2><p class="muted">Your listing becomes active only after the payment is successfully confirmed.</p><button id="pay" class="btn">Pay ₦1,000 & activate</button></div></main><script>async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d}async function load(){try{const d=await api('/api/vendor/dashboard');if(d.business){for(const [k,v] of Object.entries(d.business)){const el=document.querySelector(`[name="${k}"]`);if(el)el.value=v||''}}document.getElementById('status').innerHTML=d.business?.active?'<div class="notice success">Your business is active and visible in search.</div>':'<div class="notice">Complete your profile, then make the activation payment.</div>'}catch(e){location.href='/?login=1'}}document.getElementById('businessForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/businesses',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert('Profile saved.');load()}catch(e){alert(e.message)}};document.getElementById('pay').onclick=async()=>{try{const d=await api('/api/payments/initialize',{method:'POST'});location.href=d.authorization_url}catch(e){alert(e.message)}};load();</script></body></html>
