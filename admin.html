<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Definals Connect</title><link rel="stylesheet" href="/styles.css"></head><body><nav><a class="brand" href="/">DEFINALS CONNECT ADMIN</a><button class="link" onclick="logout()">Logout</button></nav><main class="dash"><div id="login"><span class="eyebrow">CONTROL CENTRE</span><h1>Admin login</h1><form id="lf" class="card" style="max-width:520px"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button class="btn">Login</button></form></div><div id="dash" class="hidden"></div></main><script>async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d}lf.onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(lf)))});load()}catch(e){alert(e.message)}};async function load(){try{const d=await api('/api/admin/dashboard');login.classList.add('hidden');dash.classList.remove('hidden');dash.innerHTML=`<span class="eyebrow">ADMIN CONTROL CENTRE</span><h1>Platform overview</h1><div class="kpis"><div class="card kpi"><span class="muted">Users</span><b>${d.stats.users}</b></div><div class="card kpi"><span class="muted">Businesses</span><b>${d.stats.businesses}</b></div><div class="card kpi"><span class="muted">Active</span><b>${d.stats.activeBusinesses}</b></div><div class="card kpi"><span class="muted">Paid revenue</span><b>₦${d.stats.paid}</b></div></div><div class="card" style="margin-top:20px"><h2>Businesses</h2><div class="tablewrap"><table class="table"><tr><th>Business</th><th>Owner</th><th>Category</th><th>Status</th><th>Actions</th></tr>${d.businesses.map(b=>`<tr><td>${b.name}</td><td>${b.owner_name}</td><td>${b.category}</td><td>${b.active?'Active':'Inactive'} / ${b.verified?'Verified':'Unverified'}</td><td><button class="btn small" onclick="toggle(${b.id},'verify',${!b.verified})">${b.verified?'Unverify':'Verify'}</button> <button class="btn small ghost" onclick="toggle(${b.id},'activate',${!b.active})">${b.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</table></div></div><div class="card" style="margin-top:20px"><h2>Referral rewards</h2><p class="muted">Pending rewards: ₦${d.stats.pendingRewards}</p><div class="tablewrap"><table class="table"><tr><th>Ambassador</th><th>Vendor</th><th>Reward</th><th>Status</th><th></th></tr>${d.referrals.map(r=>`<tr><td>${r.ambassador_name}</td><td>${r.vendor_name}</td><td>₦${r.reward}</td><td>${r.status}</td><td>${r.status==='pending'?`<button class="btn small" onclick="pay(${r.id})">Mark paid</button>`:'Paid'}</td></tr>`).join('')||'<tr><td colspan="5">No referral rewards yet.</td></tr>'}</table></div></div><div class="card" style="margin-top:20px"><h2>Customer requests</h2>${d.requests.map(r=>`<div class="faq"><b>${r.request_text}</b><p class="muted">${r.name} · ${r.phone} · ${r.category||'General'} · ${r.location} · ${r.status}</p></div>`).join('')||'<p class="muted">No requests.</p>'}</div>`}catch(e){login.classList.remove('hidden');dash.classList.add('hidden')}}async function toggle(id,type,value){await api('/api/admin/businesses/'+id+'/'+type,{method:'POST',body:JSON.stringify({[type==='verify'?'verified':'active']:value})});load()}async function pay(id){await api('/api/admin/referrals/'+id+'/pay',{method:'POST'});load()}async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}load();</script></body></html>
