<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Dashboard — Definals Connect</title><link rel="stylesheet" href="/styles.css"></head><body><nav><a class="brand" href="/">DEFINALS CONNECT</a><div class="navlinks"><a href="/">Discover</a><a href="/onboarding.html">Edit profile</a><button class="link" onclick="logout()">Logout</button></div></nav><main class="dash"><div id="root">Loading...</div></main><script>async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d}async function load(){try{const d=await api('/api/vendor/dashboard');document.getElementById('root').innerHTML=`<span class="eyebrow">VENDOR DASHBOARD</span><h1>${d.user.name}</h1><div class="kpis"><div class="card kpi"><span class="muted">Listing</span><b>${d.business?.active?'Active':'Inactive'}</b></div><div class="card kpi"><span class="muted">Verified</span><b>${d.business?.verified?'Yes':'Pending'}</b></div><div class="card kpi"><span class="muted">Products</span><b>${d.products.length}</b></div><div class="card kpi"><span class="muted">Referral code</span><b>${d.user.referral_code||'—'}</b></div></div><div class="card" style="margin-top:20px"><h2>Business profile</h2>${d.business?`<p><b>${d.business.name}</b> · ${d.business.category} · ${d.business.location}</p><p class="muted">${d.business.description||'No description yet.'}</p>`:'<p>Create your profile to get listed.</p>'}<a class="btn" href="/onboarding.html">${d.business?'Edit profile':'Create profile'}</a></div><div class="card" style="margin-top:20px"><h2>Products & services</h2><form id="pf" class="formgrid"><input name="name" placeholder="Product/service name" required><input name="price" type="number" placeholder="Price (₦)"><input class="full" name="imageUrl" placeholder="Image URL (optional)"><button class="btn full">Add</button></form><div class="grid" style="margin-top:18px">${d.products.map(p=>`<div class="card"><b>${p.name}</b><p>₦${p.price||'Contact us'}</p><button class="link" onclick="del(${p.id})">Remove</button></div>`).join('')||'<p class="muted">No products/services added yet.</p>'}</div></div><div class="card" style="margin-top:20px"><h2>Customer requests near your profile</h2>${d.requests.map(r=>`<div class="faq"><b>${r.request_text}</b><p class="muted">${r.category||'General'} · ${r.location} · ${r.budget?'₦'+r.budget:'Budget not stated'}</p><a class="btn small" href="https://wa.me/${String(r.phone).replace(/\D/g,'')}">Contact customer</a> <button class="btn small ghost" onclick="contacted(${r.id})">Mark contacted</button></div>`).join('')||'<p class="muted">No matching open requests right now.</p>'}</div>`;document.getElementById('pf').onsubmit=async e=>{e.preventDefault();try{await api('/api/products',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});load()}catch(e){alert(e.message)}}}catch(e){location.href='/'}}async function del(id){await api('/api/products/'+id,{method:'DELETE'});load()}async function contacted(id){await api('/api/vendor/requests/'+id+'/contacted',{method:'POST'});load()}async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}load();</script></body></html>
